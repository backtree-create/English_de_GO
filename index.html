<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語でGO! ｜ 小中学校の英単語スペリングゲーム</title>
<meta name="description" content="日本語の意味を見て英単語のつづりを制限時間内に打ちこむ、小中学校向けの英単語ゲームです。">
<meta name="theme-color" content="#2A1B45">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="英語でGO!">
<meta property="og:description" content="小中学校の英単語2300語からランダム出題。制限時間内につづりを打ちこもう。">
<meta property="og:image" content="icon-512.png">
<meta property="og:type" content="website">
<style>
  html, body { margin:0; padding:0; height:100%; background:#150C2B; }
  body {
    font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;
    color:#fff; -webkit-text-size-adjust:100%; overscroll-behavior:none;
  }
  #root {
    max-width:1000px; margin:0 auto;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom)) 12px;
    box-sizing:border-box;
  }
  #boot {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; min-height:70vh; text-align:center;
  }
  #boot img { width:96px; height:96px; border-radius:22px; }
  #boot p { font-weight:800; font-size:14px; color:#C9BEEA; margin:0; }
  #boot .bar { width:180px; height:8px; border-radius:999px; background:#2A1B45; overflow:hidden; }
  #boot .bar i { display:block; height:100%; width:40%; background:#FFD43B; border-radius:999px;
    animation:load 1.1s ease-in-out infinite alternate; }
  @keyframes load { from{transform:translateX(-60%)} to{transform:translateX(220%)} }
  #err { display:none; max-width:640px; margin:40px auto; padding:16px 20px; line-height:1.9;
    background:#2A1B45; border:3px solid #FFD43B; border-radius:14px; font-size:13px; }
</style>
</head>
<body>

<div id="root">
  <div id="boot">
    <img src="icon-192.png" alt="">
    <p>読みこみ中…</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<div id="err">
  <b>読みこみに失敗しました。</b><br>
  ネットワークにつながっているか確認してください。パソコンのフォルダから直接
  <code>index.html</code> を開いた場合は動きません。GitHub Pages の URL から開いてください。
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<script type="text/babel" src="app.jsx" data-presets="react"></script>

<script>
  // 10秒たっても起動しなければ案内を出す
  setTimeout(function () {
    var boot = document.getElementById("boot");
    if (boot && document.body.contains(boot)) {
      document.getElementById("err").style.display = "block";
    }
  }, 10000);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>

</body>
</html>
